<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bella’s Search — Playable Preview</title><link rel="stylesheet" href="bella-search.css?v=20261102-search-composed48"><style>body{margin:0;background:#100b07;color:#ffe7ac;font:18px Georgia}main{padding:30px;text-align:center}main button,main select{margin:8px;padding:14px;font:18px Georgia;max-width:100%;background:#21180e;color:#ffe7ac;border:1px solid #bd913e}#result{line-height:1.5}</style><main><h1>Bella’s Search</h1><p>Playable preview · progress and coins stay separate from your game.</p><label for="scene">Choose a season</label><select id="scene"></select><div id="layouts"></div><p id="result">Choose an arrangement to explore.</p><button id="reset">Reset this preview only</button></main><link rel="stylesheet" href="season-loading.css?v=20261105-season-loading1"><script src="season-loading.js?v=20261105-season-loading1"></script><script src="bella-search-scenes.js?v=20261102-search-composed48"></script><script src="bella-search-clutter.js?v=20261102-search-composed48"></script><script src="bella-search-composed-scenes.js?v=20261102-search-composed48"></script><script src="bella-search-campaign-scenes.js?v=20261102-search-composed48"></script><script src="bella-search-production-scenes.js?v=20261102-search-composed48"></script><script src="bella-search.js?v=20261105-season-loading1"></script><script>
const levels=[5,15,25,30,40,45],params=new URL(location.href).searchParams,scene=document.getElementById('scene');
const previewKey=params.get('preview')==='production48'?'throne_bella_search_composed48_preview_v1':'throne_bella_search_preview_v1',previewWallet=previewKey+'_coins';ThroneBellaSearch.configure({storageKey:previewKey,walletKey:previewWallet});
for(const season of ThroneBellaSearch.availableSeasons()){const o=document.createElement('option');o.value=season;o.textContent='Season '+season+' · '+ThroneBellaSearchScenes[season].name;scene.append(o);}
if(ThroneBellaSearch.availableSeasons().includes(Number(params.get('season'))))scene.value=params.get('season');
function launch(level){ThroneBellaSearch.open({season:Number(scene.value),level,onComplete:r=>document.getElementById('result').textContent=(r.status==='complete'?'All ten found · +'+r.reward+' preview coins.':'Skipped · no penalty.')+' In the game, this returns you to the next trivia level.'}).then(ok=>{if(!ok)document.getElementById('result').textContent='That arrangement is already finished in this preview. Reset the preview to review it again.';}).catch(()=>document.getElementById('result').textContent='The room could not load. Check your connection and try again.');}
for(const level of levels){const b=document.createElement('button');b.textContent='After Level '+level;b.onclick=()=>launch(level);document.getElementById('layouts').append(b);}
document.getElementById('reset').onclick=()=>{localStorage.removeItem(previewKey);localStorage.removeItem(previewWallet);document.getElementById('result').textContent='Preview reset. Game progress is untouched.';};
if(levels.includes(Number(params.get('level'))))launch(Number(params.get('level')));
</script></html>
