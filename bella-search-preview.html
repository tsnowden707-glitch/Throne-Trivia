<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bella’s Search — local playable review</title><link rel="stylesheet" href="bella-search.css?v=20261030-search1"><style>body{margin:0;background:#100b07;color:#ffe7ac;font:18px Georgia}main{padding:30px;text-align:center}main button{margin:8px;padding:14px;font:18px Georgia}#result{line-height:1.5}</style><main><h1>Bella’s Search</h1><p>Winterfell · local playable review</p><div id="layouts"></div><p id="result">Choose an arrangement to explore. Preview coins are separate from game progress.</p><button id="reset">Reset this preview only</button></main><script src="bella-search.js?v=20261030-search1"></script><script>
const levels=[5,15,25,30,40,45];const params=new URL(location.href).searchParams;function launch(level){ThroneBellaSearch.open({level,onComplete:r=>document.getElementById('result').textContent=(r.status==='complete'?'All ten found · +'+r.reward+' preview coins.':'Skipped · no penalty.')+' The game returns to the next trivia level here.'}).then(ok=>{if(!ok)document.getElementById('result').textContent='That arrangement is already finished in this preview. Reset the preview to review it again.';});}for(const level of levels){const b=document.createElement('button');b.textContent='After Level '+level+(level===5?' · Easy':level===45?' · Hard':'');b.onclick=()=>launch(level);document.getElementById('layouts').append(b);}document.getElementById('reset').onclick=()=>{localStorage.removeItem('throne_bella_search_preview_v1');localStorage.removeItem('throne_bella_search_preview_coins_v1');document.getElementById('result').textContent='Preview reset. Game progress is untouched.';};if(levels.includes(Number(params.get('level'))))launch(Number(params.get('level')));
</script></html>
