<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bella’s Search — Composed Room Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100b07;color:#ffe7ac;font-family:Georgia,serif}main{height:100dvh;display:grid;grid-template-rows:78px minmax(0,1fr) auto;gap:7px;padding:8px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-variant:small-caps;font-size:clamp(23px,4vw,38px)}header div{text-align:center;background:url(approved-answer-fill.svg) center/100% 100%;padding:12px 36px}header small{font-size:12px}#count{white-space:nowrap;padding:15px;font-size:22px}#viewport{overflow:hidden;position:relative;border:2px solid #b68c40;touch-action:none;background:#17100b}#world{position:absolute;width:1672px;height:941px;transform-origin:0 0}#room{width:100%;height:100%;display:block;user-select:none;pointer-events:none}.spot{position:absolute;border:0;background:transparent;cursor:crosshair;border-radius:45%;padding:0;touch-action:none}.spot:focus-visible{outline:3px solid gold}.spot.found{pointer-events:none}.spot.flash,.spot.hint{box-shadow:0 0 15px 6px #ffe084;border:3px solid #ffdf80;background:#ffd46925}footer{display:grid;gap:6px}#list{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;background:url(approved-answer-fill.svg) center/100% 100%;padding:14px 24px}.item{text-align:center;font-size:12px;min-width:0}.item.done{color:#a5e9a2}.item.done:before{content:'✓ '}.thumb{width:58px;height:48px;max-width:100%;margin:auto;background-image:url(bella-search-assets/winterfell-composed-concept.png);background-repeat:no-repeat;border-radius:4px}nav{display:flex;gap:6px;justify-content:center;align-items:center}button.control{font:17px Georgia;color:#ffe7ac;background:#20170c;border:1px solid #c69b4b;border-radius:4px;padding:9px 16px;cursor:pointer}#message{margin:0;text-align:center;font-size:13px;min-height:17px}#reset{margin-left:12px}@media(orientation:portrait){main{grid-template-rows:79px minmax(0,1fr) auto}header div{padding:10px 21px}header small{font-size:10px}#count{padding:3px;font-size:18px}#list{grid-template-columns:repeat(5,minmax(0,1fr));padding:15px 18px;gap:7px}.thumb{height:35px}.item{font-size:10px}button.control{padding:8px 10px;font-size:14px}#reset{margin-left:0}}@media(max-height:480px){main{grid-template-rows:52px minmax(0,1fr) auto;gap:3px}header div{padding:5px 25px}h1{font-size:25px}#list{padding:8px 18px}.thumb{height:26px}.item{font-size:10px}button.control{padding:5px 10px;font-size:13px}#message{font-size:11px}}
</style><main><header><div><h1>Bella’s Search</h1><small>Winterfell · composed-room test · separate from your game</small></div><strong id="count">0 / 10</strong></header><section id="viewport" aria-label="Search the Winterfell room. Drag to explore."><div id="world"><img id="room" src="bella-search-assets/winterfell-composed-concept.png" alt="A richly furnished Winterfell room with hidden objects" draggable="false"></div></section><footer><div id="list" aria-label="Objects to find"></div><p id="message" role="status">Find the objects pictured below. Zoom in and drag to explore.</p><nav><button class="control" id="hint">Hint</button><button class="control" id="out" aria-label="Zoom out">−</button><button class="control" id="fit">Fit</button><button class="control" id="in" aria-label="Zoom in">+</button><button class="control" id="reset">Play Again</button></nav></footer></main>
<script>
const targets=[['Lantern',89,225,57,78],['Drinking Horn',245,239,115,57],['Basket',317,733,101,124],['Chest',441,817,175,116],['Scroll',722,557,127,49],['Goblet',949,507,42,85],['Feather',898,573,141,76],['Gemstone',775,643,23,18],['Coin',884,658,35,26],['Wax Seal',867,690,29,20]];
const world=document.querySelector('#world'),viewport=document.querySelector('#viewport'),list=document.querySelector('#list'),message=document.querySelector('#message');let scale=1,tx=0,ty=0,drag=null,moved=false;const found=new Set();
function render(){const r=viewport.getBoundingClientRect();tx=1672*scale<=r.width?(r.width-1672*scale)/2:Math.max(r.width-1672*scale,Math.min(0,tx));ty=941*scale<=r.height?(r.height-941*scale)/2:Math.max(r.height-941*scale,Math.min(0,ty));world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
function fit(fill=true){const r=viewport.getBoundingClientRect();scale=fill?Math.max(r.width/1672,r.height/941):Math.min(r.width/1672,r.height/941);tx=(r.width-1672*scale)/2;ty=(r.height-941*scale)/2;render()}
function zoom(f){const r=viewport.getBoundingClientRect(),old=scale;scale=Math.max(Math.min(r.width/1672,r.height/941),Math.min(3,scale*f));tx=r.width/2-(r.width/2-tx)*scale/old;ty=r.height/2-(r.height/2-ty)*scale/old;render()}
targets.forEach(([name,x,y,w,h],i)=>{const b=document.createElement('button');b.className='spot';b.dataset.index=i;b.setAttribute('aria-label','Find '+name);b.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;b.onclick=()=>{if(moved||found.has(i))return;found.add(i);b.classList.remove('hint');b.classList.add('found','flash');setTimeout(()=>b.classList.remove('flash'),1100);list.children[i].classList.add('done');document.querySelector('#count').textContent=found.size+' / 10';message.textContent=found.size===10?'All ten found! This test does not change your game progress.':name+' found.'};world.append(b);const item=document.createElement('div');item.className='item';const thumb=document.createElement('div');thumb.className='thumb';const z=Math.min(58/w,35/h);thumb.style.backgroundSize=`${1672*z}px ${941*z}px`;thumb.style.backgroundPosition=`${(58-w*z)/2-x*z}px ${(35-h*z)/2-y*z}px`;item.append(thumb,document.createTextNode(name));list.append(item)});
viewport.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY,tx,ty};moved=false});window.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)moved=true;if(moved){tx=drag.tx+dx;ty=drag.ty+dy;render()}});window.addEventListener('pointerup',()=>{drag=null;setTimeout(()=>moved=false,0)});window.addEventListener('pointercancel',()=>{drag=null;moved=false});viewport.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15)},{passive:false});document.querySelector('#fit').onclick=()=>fit(false);document.querySelector('#in').onclick=()=>zoom(1.5);document.querySelector('#out').onclick=()=>zoom(1/1.5);document.querySelector('#hint').onclick=()=>{const i=targets.findIndex((_,i)=>!found.has(i));if(i<0)return;const [name,x,y,w,h]=targets[i],r=viewport.getBoundingClientRect();scale=Math.max(scale,Math.min(2.3,r.width/300));tx=r.width/2-(x+w/2)*scale;ty=r.height/2-(y+h/2)*scale;render();const b=world.querySelector(`[data-index="${i}"]`);b.classList.add('hint');setTimeout(()=>b.classList.remove('hint'),3000);message.textContent='Look for the '+name.toLowerCase()+' in the glow.'};document.querySelector('#reset').onclick=()=>{found.clear();world.querySelectorAll('.spot').forEach(b=>b.classList.remove('found','hint','flash'));list.querySelectorAll('.item').forEach(b=>b.classList.remove('done'));document.querySelector('#count').textContent='0 / 10';message.textContent='Find the objects pictured below. Zoom in and drag to explore.';fit()};window.addEventListener('resize',fit);document.querySelector('#room').addEventListener('load',fit);fit();window.composedTest={targets,found};
</script><script src="composed-reference-view.js?v=3"></script></html>
